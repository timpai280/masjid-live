<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Masjid Live - Broadcast</title>
  <meta name="theme-color" content="#0f7b5f">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1 data-i18n="broadcast">Broadcast</h1>
  <button class="lang" id="langBtn" onclick="toggleLang()">اردو</button>
</header>
<main>
  <section id="login" class="card">
    <label for="mid" data-i18n="enterId">Enter Mosque ID</label>
    <input id="mid" class="upper" autocomplete="off" placeholder="TEST01" maxlength="12">
    <label for="pin" data-i18n="pin">Broadcaster PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8">
    <button class="btn red" id="goBtn" data-i18n="goLive">Go Live</button>
    <p class="err" id="err"></p>
    <p class="muted" data-i18n="keepOpen"></p>
  </section>

  <section id="liveBox" class="card center hidden">
    <span class="badge live" data-i18n="youAreLive">You are LIVE</span>
    <h2 id="mname"></h2>
    <div class="timer" id="timer">00:00:00</div>
    <p class="muted" id="count"></p>
    <p class="muted" id="status"></p>
    <button class="btn red" id="endBtn" data-i18n="endLive">End broadcast</button>
  </section>

  <p class="center muted"><a href="/" data-i18n="backToListen">← Back to listening</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
<script src="/i18n.js"></script>
<script src="/broadcast.js"></script>
</body>
</html>
