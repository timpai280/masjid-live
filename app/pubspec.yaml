name: masjid_live
description: Live lessons from the mosque - phone to phones.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  livekit_client: ^2.4.0
  flutter_webrtc: any
  http: ^1.2.2
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  just_audio: ^0.9.40

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
